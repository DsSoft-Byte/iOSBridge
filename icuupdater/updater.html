<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iCures Updater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-glass:       rgba(14, 14, 16, 0.88);
      --border-subtle:  rgba(255,255,255,0.08);
      --border-strong:  rgba(255,255,255,0.16);
      --glass-edge:     inset 0 1px 1px rgba(255,255,255,0.13);
      --text-primary:   #F5F5F7;
      --text-secondary: #86868B;
      --text-muted:     #515154;
      --accent:         #0A84FF;
      --accent-glow:    rgba(10,132,255,0.35);
      --success:        #30D158;
      --danger:         #FF453A;
      --ease-out-expo:  cubic-bezier(0.16,1,0.3,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0c;
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .shell {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      background: rgba(20, 20, 22, 0.98);
      border: 1px solid var(--border-subtle);
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
    }

    /* Title bar */
    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 40px; flex-shrink: 0;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(255,255,255,0.02);
    }
    .titlebar__brand { font-size: 0.8125rem; font-weight: 600; color: var(--text-secondary); }
    .tb-close {
      width: 12px; height: 12px; border-radius: 50%;
      background: #FF5F57; border: none; cursor: pointer;
      -webkit-app-region: no-drag;
      transition: filter 0.2s;
    }
    .tb-close:hover { filter: brightness(1.3); }

    /* Content */
    .content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 28px; gap: 20px; text-align: center;
    }

    .icon { font-size: 3rem; line-height: 1; }

    .heading {
      font-size: 1.25rem; font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg,#fff 0%,#86868B 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtext { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.5; max-width: 320px; }

    /* Progress */
    .progress-wrap {
      width: 100%; height: 4px; background: rgba(255,255,255,0.08);
      border-radius: 999px; overflow: hidden; display: none;
    }
    .progress-bar {
      height: 100%; width: 0%; background: var(--accent);
      border-radius: 999px; box-shadow: 0 0 8px var(--accent-glow);
      transition: width 0.4s var(--ease-out-expo);
    }

    /* Status */
    .status { font-size: 0.8125rem; font-weight: 500; color: var(--text-muted); min-height: 1.2em; }
    .status--success { color: var(--success); }
    .status--error   { color: var(--danger); }

    /* Buttons */
    .btn-row { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1; padding: 12px 20px; border-radius: 999px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s var(--ease-out-expo);
      border: 1px solid var(--border-strong);
      background: rgba(255,255,255,0.06); color: var(--text-primary);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.13);
    }
    .btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.35; pointer-events: none; }
    .btn--accent {
      background: var(--accent); border-color: transparent; color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .btn--accent:hover { background: #2998ff; }
  </style>
</head>
<body>
<div class="shell">

  <div class="titlebar">
    <span class="titlebar__brand">iCures Updater</span>
    <button class="tb-close" onclick="updater.close()"></button>
  </div>

  <div class="content">
    <div class="icon" id="icon">📦</div>
    <div class="heading" id="heading">Ready to Update</div>
    <p class="subtext" id="subtext">
      The update files are prepared at <code>C:\UpdateData</code>.<br>
      Click <strong>Install</strong> to copy them to <code>C:\iCures</code> and finish.
    </p>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="btn-row" id="btn-row">
      <button class="btn" onclick="updater.close()">Cancel</button>
      <button class="btn btn--accent" onclick="applyUpdate()" id="install-btn">Install Update</button>
    </div>
  </div>

</div>
<script>
  async function applyUpdate() {
    const btn     = document.getElementById('install-btn')
    const status  = document.getElementById('status')
    const progress = document.getElementById('progress-wrap')
    const bar     = document.getElementById('progress-bar')
    const heading = document.getElementById('heading')
    const subtext = document.getElementById('subtext')
    const icon    = document.getElementById('icon')

    btn.disabled = true
    document.querySelector('.btn:not(#install-btn)').disabled = true
    progress.style.display = 'block'
    status.textContent = 'Copying files…'
    status.className = 'status'

    // Fake progress animation while copy runs (file copy has no granular progress)
    let fake = 0
    const ticker = setInterval(() => {
      fake = Math.min(fake + Math.random() * 12, 88)
      bar.style.width = fake + '%'
    }, 200)

    try {
      await updater.applyUpdate()
      clearInterval(ticker)
      bar.style.width = '100%'
      icon.textContent = '✅'
      heading.textContent = 'Update Complete'
      subtext.textContent = 'iCures has been updated successfully. The app will now close.'
      status.textContent = 'Cleaning up…'
      status.className = 'status status--success'
      document.getElementById('btn-row').innerHTML = ''

      setTimeout(async () => {
        await updater.quit()
      }, 2000)

    } catch (err) {
      clearInterval(ticker)
      icon.textContent = '⚠️'
      heading.textContent = 'Update Failed'
      status.textContent = err?.message || 'An error occurred during the update.'
      status.className = 'status status--error'
      btn.disabled = false
      document.querySelector('.btn:not(#install-btn)').disabled = false
    }
  }
</script>
</body>
</html>
