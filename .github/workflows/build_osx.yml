name: Build macOS

# Builds the x64 dmg on an Intel runner and the arm64 dmg on an Apple Silicon
# runner. Each runner compiles its OWN architecture's libimobiledevice stack,
# and electron-builder is pinned to that one arch (--x64 / --arm64) so a dmg
# never ships native binaries for the wrong architecture.

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

defaults:
  run:
    working-directory: icureselectron

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13      # Intel  → x86_64
            arch: x64
          - runner: macos-14      # Apple Silicon → arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }} (${{ matrix.runner }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: icureselectron/package-lock.json

      # libimobiledevice build prerequisites. Homebrew is preinstalled on the
      # runners; `brew install` is a no-op for anything already present.
      - name: Install build prerequisites (brew)
        run: |
          brew install \
            automake libtool libusb libzip gnutls libgcrypt \
            pkg-config libxml2 curl dylibbundler

      - name: Install npm dependencies
        run: npm ci

      # Compile the native stack for THIS runner's architecture into
      # build/native/mac/{bin,libs}. Using the _armmac variant on both arches:
      # its only functional difference is the libplist tools/ HEAD-breakage
      # workaround, which is architecture-agnostic and protects the fresh
      # HEAD clone that CI always does.
      - name: Build libimobiledevice stack (${{ matrix.arch }})
        run: bash scripts/build-deps_armmac.sh

      - name: Generate icon.icns
        run: node scripts/gen-icons.js

      # Pin electron-builder to the single matching arch. CSC_IDENTITY_AUTO_DISCOVERY=false
      # keeps it from trying to code-sign with a nonexistent certificate; the
      # native binaries are already ad-hoc signed inside the deps script.
      - name: Package dmg (${{ matrix.arch }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: iosbridge-mac-${{ matrix.arch }}
          path: |
            icureselectron/dist/*.dmg
            icureselectron/dist/*.dmg.blockmap
          if-no-files-found: error
