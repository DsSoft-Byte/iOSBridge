name: Build macOS

# arm64-only. GitHub no longer offers Intel (macos-13) runners, so the x64 dmg
# is built locally on the Intel dev machine:
#   bash scripts/build-deps_armmac.sh && npx electron-builder --mac --x64
# The _armmac deps script is arch-agnostic, so it produces correct x86_64
# binaries on an Intel host. To restore x64 CI later, re-add a matrix entry
# for whatever Intel runner is available (or a self-hosted one) and pass --x64.

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

defaults:
  run:
    working-directory: icureselectron

jobs:
  build:
    runs-on: macos-14      # Apple Silicon -> arm64
    name: arm64 (macos-14)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: icureselectron/package-lock.json

      # libimobiledevice build prerequisites. Homebrew is preinstalled on the
      # runners; `brew install` is a no-op for anything already present.
      - name: Install build prerequisites (brew)
        run: |
          brew install \
            automake libtool libusb libzip gnutls libgcrypt \
            pkg-config libxml2 curl dylibbundler

      - name: Install npm dependencies
        run: npm ci

      # Compile the native stack (arm64) into build/native/mac/{bin,libs}.
      - name: Build libimobiledevice stack (arm64)
        run: bash scripts/build-deps_armmac.sh

      - name: Generate icon.icns
        run: node scripts/gen-icons.js

      # Pin electron-builder to arm64 so the dmg carries only matching binaries.
      # CSC_IDENTITY_AUTO_DISCOVERY=false skips code-signing with a nonexistent
      # certificate; the native binaries are ad-hoc signed inside the deps script.
      - name: Package dmg (arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: iosbridge-mac-arm64
          path: |
            icureselectron/dist/*.dmg
            icureselectron/dist/*.dmg.blockmap
          if-no-files-found: error
